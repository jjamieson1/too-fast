<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" width="780" height="730" font-family="Helvetica, Arial, sans-serif"><rect width="780" height="730" fill="#14171d"/><g transform="translate(30,30)"><rect width="220" height="320" rx="16" fill="#1b1f27" stroke="#2e9d4f" stroke-width="4"/><rect x="10" y="10" width="200" height="44" rx="8" fill="#2e9d4f"/><text x="110.0" y="39" font-size="16" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="3">BOOST</text><text x="110.0" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#fff">Bribe a Cop</text><text x="110.0" y="116" font-size="12" text-anchor="middle" fill="#2e9d4f" font-weight="700">INSTANT</text><line x1="24" y1="132" x2="196" y2="132" stroke="#3a3f4b"/><text x="110.0" y="162" font-size="15" text-anchor="middle" fill="#e8e8e8">Cancel being Pulled Over</text><text x="110.0" y="183" font-size="15" text-anchor="middle" fill="#e8e8e8">or Busted. Set your Heat</text><text x="110.0" y="204" font-size="15" text-anchor="middle" fill="#e8e8e8">to 1.</text><text x="110.0" y="272" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">“I didn't see anything.”</text></g><g transform="translate(280,30)"><rect width="220" height="320" rx="16" fill="#1b1f27" stroke="#2e9d4f" stroke-width="4"/><rect x="10" y="10" width="200" height="44" rx="8" fill="#2e9d4f"/><text x="110.0" y="39" font-size="16" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="3">BOOST</text><text x="110.0" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#fff">Oil Slick</text><text x="110.0" y="116" font-size="12" text-anchor="middle" fill="#2e9d4f" font-weight="700">INSTANT</text><line x1="24" y1="132" x2="196" y2="132" stroke="#3a3f4b"/><text x="110.0" y="162" font-size="15" text-anchor="middle" fill="#e8e8e8">Place an oil slick token</text><text x="110.0" y="183" font-size="15" text-anchor="middle" fill="#e8e8e8">on any empty Plain</text><text x="110.0" y="204" font-size="15" text-anchor="middle" fill="#e8e8e8">space.</text><text x="110.0" y="272" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">Oops. Was that me?</text></g><g transform="translate(530,30)"><rect width="220" height="320" rx="16" fill="#1b1f27" stroke="#2e9d4f" stroke-width="4"/><rect x="10" y="10" width="200" height="44" rx="8" fill="#2e9d4f"/><text x="110.0" y="39" font-size="16" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="3">BOOST</text><text x="110.0" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#fff">Empty Street</text><text x="110.0" y="116" font-size="12" text-anchor="middle" fill="#2e9d4f" font-weight="700">AFTER MOVE</text><line x1="24" y1="132" x2="196" y2="132" stroke="#3a3f4b"/><text x="110.0" y="162" font-size="15" text-anchor="middle" fill="#e8e8e8">Move forward 3 more</text><text x="110.0" y="183" font-size="15" text-anchor="middle" fill="#e8e8e8">spaces, then resolve</text><text x="110.0" y="204" font-size="15" text-anchor="middle" fill="#e8e8e8">that space.</text><text x="110.0" y="272" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">3 a.m. Not a soul in sight.</text></g><g transform="translate(30,380)"><rect width="220" height="320" rx="16" fill="#1b1f27" stroke="#e0701a" stroke-width="4"/><rect x="10" y="10" width="200" height="44" rx="8" fill="#e0701a"/><text x="110.0" y="39" font-size="16" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="3">OBSTACLE</text><text x="110.0" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#fff">Flat Tire</text><text x="110.0" y="116" font-size="12" text-anchor="middle" fill="#e0701a" font-weight="700">RESOLVE NOW</text><line x1="24" y1="132" x2="196" y2="132" stroke="#3a3f4b"/><text x="110.0" y="162" font-size="15" text-anchor="middle" fill="#e8e8e8">−2 to your rolls until</text><text x="110.0" y="183" font-size="15" text-anchor="middle" fill="#e8e8e8">you stop at a Gas</text><text x="110.0" y="204" font-size="15" text-anchor="middle" fill="#e8e8e8">Station. Or park for a</text><text x="110.0" y="225" font-size="15" text-anchor="middle" fill="#e8e8e8">turn to fix it now.</text><text x="110.0" y="272" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">Pssssssss…</text></g><g transform="translate(280,380)"><rect width="220" height="320" rx="16" fill="#1b1f27" stroke="#e0701a" stroke-width="4"/><rect x="10" y="10" width="200" height="44" rx="8" fill="#e0701a"/><text x="110.0" y="39" font-size="16" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="3">OBSTACLE</text><text x="110.0" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#fff">Police Checkpoint</text><text x="110.0" y="116" font-size="12" text-anchor="middle" fill="#e0701a" font-weight="700">RESOLVE NOW</text><line x1="24" y1="132" x2="196" y2="132" stroke="#3a3f4b"/><text x="110.0" y="162" font-size="15" text-anchor="middle" fill="#e8e8e8">Heat 1+: you're Pulled</text><text x="110.0" y="183" font-size="15" text-anchor="middle" fill="#e8e8e8">Over. Heat 0: gain 1 Rep</text><text x="110.0" y="204" font-size="15" text-anchor="middle" fill="#e8e8e8">(clean record).</text><text x="110.0" y="272" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">License and registration,</text><text x="110.0" y="290" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">please.</text></g><g transform="translate(530,380)"><rect width="220" height="320" rx="16" fill="#1b1f27" stroke="#8e44ad" stroke-width="4"/><rect x="10" y="10" width="200" height="44" rx="8" fill="#8e44ad"/><text x="110.0" y="39" font-size="16" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="3">UPGRADE</text><text x="110.0" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#fff">Nitrous</text><text x="110.0" y="116" font-size="12" text-anchor="middle" fill="#8e44ad" font-weight="700">COST: 3 REP</text><line x1="24" y1="132" x2="196" y2="132" stroke="#3a3f4b"/><text x="110.0" y="162" font-size="15" text-anchor="middle" fill="#e8e8e8">After burning fuel,</text><text x="110.0" y="183" font-size="15" text-anchor="middle" fill="#e8e8e8">before rolling: +3 to</text><text x="110.0" y="204" font-size="15" text-anchor="middle" fill="#e8e8e8">this roll, +1 Heat.</text><text x="110.0" y="225" font-size="15" text-anchor="middle" fill="#e8e8e8">Refills at gas stations.</text><text x="110.0" y="272" font-size="13" font-style="italic" text-anchor="middle" fill="#9aa0aa">Push the red button.</text></g></svg>